<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<title>Grok Desk</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b0b0f;color:#eee;
       padding:calc(env(safe-area-inset-top) + 24px) 20px 24px}
  .mode{display:inline-block;padding:3px 10px;border-radius:999px;background:#3a2f00;color:#ffcc33;font-size:12px;font-weight:600}
  .bal{font-size:44px;font-weight:700;margin:12px 0 4px}
  .muted{color:#888;font-size:13px}
  .err{color:#ff6b6b}
</style>
</head>
<body>
  <span class="mode" id="mode">…</span>
  <div class="bal" id="bal">—</div>
  <div class="muted" id="upd">Loading…</div>
<script>
(function(){
  // The data path lives only in the URL fragment (#d=...), which browsers never send to the server.
  var m = location.hash.match(/(?:^#|&)d=([A-Za-z0-9_-]{32,})/);
  var key = m ? m[1] : localStorage.getItem("desk_d");
  if (m) { localStorage.setItem("desk_d", m[1]); history.replaceState(null, "", location.pathname); }
  var $ = function(id){ return document.getElementById(id); };
  if (!key) { $("upd").textContent = "Open the link from Telegram to connect."; $("upd").className = "muted err"; return; }
  function load(){
    fetch("d/" + key + "/state.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(s){
        $("mode").textContent = s.mode;
        $("bal").textContent = "$" + Number(s.balance).toFixed(2);
        $("upd").textContent = "Updated " + new Date(s.ts).toLocaleTimeString() + " · refreshes every few minutes";
        $("upd").className = "muted";
      })
      .catch(function(e){ $("upd").textContent = "No data (" + e.message + ")"; $("upd").className = "muted err"; });
  }
  load(); setInterval(load, 60000);
})();
</script>
</body>
</html>
